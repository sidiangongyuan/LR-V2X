# ============================================
# DiffV2X Stage 2: Zero-Prior Diffusion Training
# ============================================
# NEW VERSION: Uses zero prior instead of ground truth x0
# Training: x_t = q_sample(zero, t, noise) instead of q_sample(x0, t, noise)
# Inference: Only needs agent_latent, no ground truth required
# This enables true V2X bandwidth compression
# ============================================

name: dairv2x_diffv2x_stage3_prior_latent_finetune_2x
data_dir: "/mnt/sdc/public/data/yangk/cooperative-vehicle-infrastructure"
root_dir: "/mnt/sdc/public/data/yangk/cooperative-vehicle-infrastructure/train.json"
validate_dir: "/mnt/sdc/public/data/yangk/cooperative-vehicle-infrastructure/val.json"
test_dir: "/mnt/sdc/public/data/yangk/cooperative-vehicle-infrastructure/val.json"

yaml_parser: "load_general_params"
train_params:
  batch_size: &batch_size 8  # Lower batch size for end-to-end training
  epoches: 20
  eval_freq: 1
  save_freq: 4
  max_cav: 2
  stage3_diffusion_weight: 0.1  # Moderate weight for joint training
  freeze_diffusion: false       # Allow diffusion to fine-tune
  freeze_detection_backbone: true  # CRITICAL: Freeze encoder/backbone to prevent moving target problem!

comm_range: 100
input_source: ['lidar']
label_type: 'lidar'
cav_lidar_range: &cav_lidar [-102.4, -51.2, -3.5, 102.4, 51.2, 1.5]

heter:
  assignment_path: null
  ego_modality: &ego_modality "m1"
  mapping_dict:
    m1: m1
    m2: m1
  modality_setting:
    m1:
      sensor_type: &sensor_type_m1 'lidar'
      core_method: &core_method_m1 "point_pillar"

      # lidar requires preprocess
      preprocess:
        # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
        core_method: 'SpVoxelPreprocessor'
        args:
          voxel_size: &voxel_size [0.4, 0.4, 5]
          max_points_per_voxel: 32
          max_voxel_train: 32000
          max_voxel_test: 70000
        # lidar range for each individual cav.
        cav_lidar_range: *cav_lidar


fusion:
  core_method: 'intermediateheter'
  dataset: 'dairv2x'
  args: 
    proj_first: false
    grid_conf: None # place-holder
    data_aug_conf: None # place-holder

preprocess:
  # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: [0.4, 0.4, 5] # useful
    max_points_per_voxel: 1 # useless
    max_voxel_train: 1 # useless
    max_voxel_test: 1 # useless
  # lidar range for each individual cav.
  cav_lidar_range: *cav_lidar

# anchor box related
postprocess:
  core_method: 'VoxelPostprocessor' # VoxelPostprocessor, BevPostprocessor supported
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: &anchor_yaw [0, 90]
    feature_stride: 2
    num: &anchor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: 'hwl' # hwl or lwh
  max_num: 150 # maximum number of objects in a single frame. use this number to make sure different frames has the same dimension in the same batch
  nms_thresh: 0.15
  dir_args: &dir_args
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *anchor_yaw


# model related
model:
  core_method: diffv2x_pyramid
  args:
    # Stage 3: End-to-end fine-tuning
    use_diffusion: true
    diffusion_training_only: false  # FIXED: Train everything, not just diffusion!

    lidar_range: *cav_lidar
    supervise_single: True

    m1:
      core_method: *core_method_m1
      sensor_type: *sensor_type_m1
      encoder_args:
        voxel_size: *voxel_size
        lidar_range: *cav_lidar
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters: [64]
        point_pillar_scatter:
          num_features: 64
      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]
      aligner_args:
        core_method: identity

    # Pyramid fusion backbone (frozen in stage 2)
    fusion_backbone:
      resnext: true
      stage: collab
      layer_nums: [3, 5, 8]
      layer_strides: [1, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
      anchor_number: *anchor_num

    # Diffusion configuration (DiT) - Zero Prior
    diffusion:
      use_mode: dit-b  # Standard DiT-B: 12 layers, 768 hidden, 12 heads
      use_checkpoint: True
      use_latent_prior: true   # 启用 latent prior

      # NEW: Ego condition (DiffCP-style)
      use_ego_condition: true  # Enable ego BEV as condition

      # Latent compression
      latent_dim: 64
      bev_channels: 64
      target_spatial: [64, 128]

      # Noise schedule
      num_timesteps: 1000
      beta_schedule: 'cosine'
      beta_start: 0.0001
      beta_end: 0.02

      # Sampling configuration
      sampler_type: 'ddim'
      num_inference_steps: 20
      ddim_eta: 0.0

      # Inference timestep (fixed for deterministic results)
      inference_timestep: 150

      # No compression simulation (full communication)
      compression_ratio: 1.0

      # DiT-specific config
      dit_config:
        patch_size: 4
        spatial_h: 128  # BEV spatial size after backbone
        spatial_w: 256

        # Note: These are ignored when use_mode=dit-b
        hidden_size: 768
        depth: 18
        num_heads: 12
        mlp_ratio: 4.0
        num_cross_attn_layers: 9

    shrink_header:
      kernal_size: [3]
      stride: [1]
      padding: [1]
      dim: [256]
      input_dim: 384

    fusion_method: pyramid
    in_head: 256
    anchor_number: *anchor_num
    dir_args: *dir_args


loss:
  core_method: point_pillar_pyramid_loss  # Detection loss only (diffusion handled in training script)
  args:
    pos_cls_weight: 2.0

    # Detection losses (main objective)
    cls:
      type: 'SigmoidFocalLoss'
      alpha: 0.25
      gamma: 2.0
      weight: 1.0
    reg:
      type: 'WeightedSmoothL1Loss'
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: 'WeightedSoftmaxClassificationLoss'
      weight: 0.2
      args: *dir_args
    depth:
      weight: 1.0
    pyramid:
      relative_downsample: [1, 2, 4]
      weight: [0.4, 0.2, 0.1]


optimizer:
  core_method: Adam
  lr: 0.0002
  args:
    eps: 1e-10
    weight_decay: 1e-4


lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [15,30]
