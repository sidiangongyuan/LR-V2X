# ============================================
# DiffV2X Stage 2: Diffusion-Only Training
# ============================================
# Add diffusion module, freeze everything else, train ONLY diffusion
# Similar to codebook stage2: freeze backbone, train only diffusion module
# ============================================

name: diffv2x_stage2_dit_s
root_dir: "/mnt/sdc/public/data/yangk/v2xreal/train"
validate_dir: "/mnt/sdc/public/data/yangk/v2xreal/val"
test_dir: "/mnt/sdc/public/data/yangk/v2xreal/test"

yaml_parser: "load_general_params"
train_params:
  batch_size: &batch_size 12
  epoches: 60
  eval_freq: 2
  save_freq: 5
  max_cav: 4

comm_range: 70
input_source: ['lidar']
label_type: 'lidar'
cav_lidar_range: &cav_lidar [-140.8, -40, -3, 140.8, 40, 1]
num_class: &num_class 3
dataset_mode: 'v2v'

heter:
  assignment_path: "opencood/modality_assign/v2xreal_4modality.json"
  ego_modality: &ego_modality "m1"
  mapping_dict:
    m1: none
    m2: none
    m3: m1
    m4: m1
  modality_setting:
    m1:
      sensor_type: &sensor_type_m1 'lidar'
      core_method: &core_method_m1 "point_pillar"
      preprocess:
        core_method: 'SpVoxelPreprocessor'
        args:
          voxel_size: &voxel_size [0.4, 0.4, 4]
          max_points_per_voxel: 32
          max_voxel_train: 32000
          max_voxel_test: 70000
        cav_lidar_range: *cav_lidar

fusion:
  core_method: 'intermediateheter3class'
  dataset: 'v2xreal'
  args:
    proj_first: false
    grid_conf: None
    data_aug_conf: None

preprocess:
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: *voxel_size
    max_points_per_voxel: 1
    max_voxel_train: 1
    max_voxel_test: 1
  cav_lidar_range: *cav_lidar
  num_class: *num_class
  anchor_generator_config: &anchor_generator_config
    - 'class_name': 'vehicle'
      'anchor_sizes': [[3.9, 1.6, 1.56]]
      'anchor_rotations': [0, 1.57]
      'anchor_bottom_heights': [-1.78]
      'align_center': True
      'feature_map_stride': 2
      'matched_threshold': 0.6
      'unmatched_threshold': 0.45
    - 'class_name': 'pedestrian'
      'anchor_sizes': [[0.8, 0.6, 1.73]]
      'anchor_rotations': [0, 1.57]
      'anchor_bottom_heights': [-0.6]
      'align_center': True
      'feature_map_stride': 2
      'matched_threshold': 0.5
      'unmatched_threshold': 0.35
    - 'class_name': 'truck'
      'anchor_sizes': [[8, 3, 3]]
      'anchor_rotations': [0, 1.57]
      'anchor_bottom_heights': [-1.78]
      'align_center': True
      'feature_map_stride': 2
      'matched_threshold': 0.6
      'unmatched_threshold': 0.45

postprocess:
  core_method: 'VoxelPostprocessor3Heads'
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: &anchor_yaw [0, 90]
    feature_stride: 2
    num: &anchor_num 2
    anchor_generator_config: *anchor_generator_config
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: 'hwl'
  max_num: 150
  nms_thresh: 0.15
  dir_args: &dir_args
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *anchor_yaw

# model related
model:
  core_method: diffv2x_pyramid_mc
  args:
    # Stage 2: Train diffusion only
    use_diffusion: true
    diffusion_training_only: true

    num_class: *num_class
    lidar_range: *cav_lidar
    supervise_single: True

    m1:
      core_method: *core_method_m1
      sensor_type: *sensor_type_m1
      encoder_args:
        voxel_size: *voxel_size
        lidar_range: *cav_lidar
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters: [64]
        point_pillar_scatter:
          num_features: 64
      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]
      aligner_args:
        core_method: identity

    # Pyramid fusion backbone (frozen in stage 2)
    fusion_backbone:
      resnext: true
      stage: collab
      layer_nums: [3, 5, 8]
      layer_strides: [1, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
      anchor_number: *anchor_num

    # Diffusion configuration (DiT)
    diffusion:
      use_mode: dit-s  # Use predefined DiT-S (or 'custom' to use dit_config)
      use_checkpoint: True

      # Latent compression
      latent_dim: 64  
      bev_channels: 64
      target_spatial: [26, 88]

      # Noise schedule
      num_timesteps: 1000
      beta_schedule: 'cosine'
      beta_start: 0.0001
      beta_end: 0.02

      # Sampling configuration
      sampler_type: 'ddim'
      num_inference_steps: 20
      ddim_eta: 0.0

      # No compression simulation (full communication)
      compression_ratio: 1.0

      # DiT-specific config
      dit_config:
        patch_size: 4
        spatial_h: 100  # BEV spatial size after backbone
        spatial_w: 352

        # Note: hidden_size/depth/num_heads below are ignored when use_mode=dit-s
        # DiT-S uses predefined: 12 layers, 384 hidden, 6 heads
        hidden_size: 384  # (ignored, using predefined)
        depth: 12  # (ignored, using predefined)
        num_heads: 6  # (ignored, using predefined)
        mlp_ratio: 4.0
        num_cross_attn_layers: 6  # Used

    shrink_header:
      kernal_size: [3]
      stride: [1]
      padding: [1]
      dim: [256]
      input_dim: 384

    fusion_method: pyramid
    in_head: 256
    anchor_number: *anchor_num
    dir_args: *dir_args


# Loss configuration
loss:
  core_method: diffv2x_pyramid_loss_mc
  args:
    num_class: *num_class
    pos_cls_weight: 2.0

    # Stage 2: Only diffusion loss
    diffusion:
      weight: 1.0
      use_perceptual: false

    # Detection losses (not used in stage 2, but keep for compatibility)
    cls:
      type: 'SigmoidFocalLoss'
      alpha: 0.25
      gamma: 2.0
      weight: 0.0
    reg:
      type: 'WeightedSmoothL1Loss'
      sigma: 3.0
      codewise: true
      weight: 0.0
    dir:
      type: 'WeightedSoftmaxClassificationLoss'
      weight: 0.0
      args: *dir_args
    depth:
      weight: 0.0
    pyramid:
      relative_downsample: [1, 2, 4]
      weight: [0.0, 0.0, 0.0]


optimizer:
  core_method: Adam  # Same as Codebook
  lr: 0.0001  # Reduced for diffusion stability (was 0.002 - too large for DiT!)
  args:
    eps: 1e-10
    weight_decay: 1e-4  # Same as Codebook (was 0.01 - 100x too large!)


lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [15, 25]
