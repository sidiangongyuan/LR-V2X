name: baselines_codefilling_stage2
root_dir: data/v2xreal/train
validate_dir: data/v2xreal/val
test_dir: data/v2xreal/test
yaml_parser: load_general_params
train_params:
  batch_size: 8
  epoches: 20
  eval_freq: 1
  save_freq: 1
  max_cav: 4
comm_range: 70
input_source:
- lidar
label_type: lidar
cav_lidar_range: &id001
- -102.4
- -51.2
- -3.5
- 102.4
- 51.2
- 1.5
num_class: 3
dataset_mode: v2v
heter:
  assignment_path: opencood/modality_assign/v2xreal_4modality.json
  ego_modality: m1
  mapping_dict:
    m1: none
    m2: none
    m3: m1
    m4: m1
  modality_setting:
    m1:
      sensor_type: lidar
      core_method: point_pillar
      preprocess:
        core_method: SpVoxelPreprocessor
        args:
          voxel_size: &id002
          - 0.4
          - 0.4
          - 4
          max_points_per_voxel: 32
          max_voxel_train: 32000
          max_voxel_test: 70000
        cav_lidar_range: *id001
fusion:
  core_method: intermediateheter3class
  dataset: v2xreal
  args:
    proj_first: false
    grid_conf: None
    data_aug_conf: None
preprocess:
  core_method: SpVoxelPreprocessor
  args:
    voxel_size: *id002
    max_points_per_voxel: 1
    max_voxel_train: 1
    max_voxel_test: 1
  cav_lidar_range: *id001
  num_class: 3
  anchor_generator_config: &id003
  - class_name: vehicle
    anchor_sizes:
    - - 3.9
      - 1.6
      - 1.56
    anchor_rotations:
    - 0
    - 1.57
    anchor_bottom_heights:
    - -1.78
    align_center: true
    feature_map_stride: 2
    matched_threshold: 0.6
    unmatched_threshold: 0.45
  - class_name: pedestrian
    anchor_sizes:
    - - 0.8
      - 0.6
      - 1.73
    anchor_rotations:
    - 0
    - 1.57
    anchor_bottom_heights:
    - -0.6
    align_center: true
    feature_map_stride: 2
    matched_threshold: 0.5
    unmatched_threshold: 0.35
  - class_name: truck
    anchor_sizes:
    - - 8
      - 3
      - 3
    anchor_rotations:
    - 0
    - 1.57
    anchor_bottom_heights:
    - -1.78
    align_center: true
    feature_map_stride: 2
    matched_threshold: 0.6
    unmatched_threshold: 0.45
postprocess:
  core_method: VoxelPostprocessor3Heads
  gt_range: *id001
  anchor_args:
    cav_lidar_range: *id001
    l: 3.9
    w: 1.6
    h: 1.56
    r: &id004
    - 0
    - 90
    feature_stride: 2
    num: 2
    anchor_generator_config: *id003
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: hwl
  max_num: 150
  nms_thresh: 0.15
  dir_args: &id005
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *id004
model:
  core_method: heter_pyramid_collab_codebook_mc
  args:
    codebook:
      seg_num: 1
      dict_size: 128
    use_codebook: true
    codebook_training: true
    num_class: 3
    lidar_range: *id001
    supervise_single: true
    m1:
      core_method: point_pillar
      sensor_type: lidar
      encoder_args:
        voxel_size: *id002
        lidar_range: *id001
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters:
          - 64
        point_pillar_scatter:
          num_features: 64
      backbone_args:
        layer_nums:
        - 3
        layer_strides:
        - 2
        num_filters:
        - 64
      aligner_args:
        core_method: identity
    fusion_backbone:
      resnext: true
      stage: collab
      layer_nums:
      - 3
      - 5
      - 8
      layer_strides:
      - 1
      - 2
      - 2
      num_filters:
      - 64
      - 128
      - 256
      upsample_strides:
      - 1
      - 2
      - 4
      num_upsample_filter:
      - 128
      - 128
      - 128
      anchor_number: 2
    shrink_header:
      kernal_size:
      - 3
      stride:
      - 1
      padding:
      - 1
      dim:
      - 256
      input_dim: 384
    fusion_method: pyramid
    in_head: 256
    anchor_number: 2
    dir_args: *id005
loss:
  core_method: point_pillar_pyramid_loss_mc
  args:
    num_class: 3
    pos_cls_weight: 2.0
    cls:
      type: SigmoidFocalLoss
      alpha: 0.25
      gamma: 2.0
      weight: 1.0
    reg:
      type: WeightedSmoothL1Loss
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: WeightedSoftmaxClassificationLoss
      weight: 0.2
      args: *id005
    depth:
      weight: 1.0
    pyramid:
      relative_downsample:
      - 1
      - 2
      - 4
      weight:
      - 0.4
      - 0.2
      - 0.1
optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1e-10
    weight_decay: 1e-4
lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size:
  - 15
  - 25
